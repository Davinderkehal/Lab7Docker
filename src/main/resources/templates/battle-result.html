<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Battle Result</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>Battle Result</h1>

    <p><strong>Winner:</strong> <span th:text="${battle.winner}">Winner</span></p>
    <p><strong>Message:</strong> <span th:text="${battle.message}">Message</span></p>

    <a th:href="@{/battle}">Back to Battle</a>
</body>
</html>
